<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E14"/>
      <stop offset="100%" stop-color="#131A24"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4655" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF4655" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF4655" stop-opacity="0"/>
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E2733" stroke-width="1"/>
    </pattern>

    <clipPath id="roundedBox">
      <rect x="0" y="0" width="1200" height="300" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedBox)">
    <!-- background -->
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- diagonal HUD accent shapes -->
    <polygon points="0,300 260,300 180,220 0,220" fill="#FF4655" opacity="0.08"/>
    <polygon points="1200,0 1200,60 1040,0" fill="#FF4655" opacity="0.08"/>

    <!-- scanning line animation -->
    <rect x="0" y="0" width="4" height="300" fill="url(#accentLine)" opacity="0.6">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 1196 0; 0 0" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- crosshair, top right -->
    <g transform="translate(1100,55)" stroke="#FF4655" stroke-width="2" opacity="0.9">
      <line x1="-22" y1="0" x2="-10" y2="0"/>
      <line x1="10" y1="0" x2="22" y2="0"/>
      <line x1="0" y1="-22" x2="0" y2="-10"/>
      <line x1="0" y1="10" x2="0" y2="22"/>
      <circle cx="0" cy="0" r="3" fill="#FF4655"/>
      <circle cx="0" cy="0" r="16" fill="none" opacity="0.5">
        <animate attributeName="r" values="12;20;12" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- top thin accent bar -->
    <rect x="0" y="0" width="1200" height="4" fill="#FF4655">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </rect>

    <!-- main title -->
    <text x="600" y="140" text-anchor="middle" font-family="'Courier New', monospace"
      font-size="62" font-weight="700" fill="#FFFFFF" letter-spacing="6" filter="url(#softGlow)">
      OKANSYAILENDRA
      <animate attributeName="fill" values="#FFFFFF;#FF4655;#FFFFFF" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- underline accent -->
    <rect x="380" y="160" width="440" height="3" fill="#FF4655" filter="url(#neonGlow)">
      <animate attributeName="width" values="0;440;440;0" keyTimes="0;0.3;0.85;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x" values="600;380;380;600" keyTimes="0;0.3;0.85;1" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- subtitle -->
    <text x="600" y="200" text-anchor="middle" font-family="'Courier New', monospace"
      font-size="22" fill="#9FB3C8" letter-spacing="3">
      &gt; INFORMATICS_ENGINEERING_STUDENT
      <tspan fill="#FF4655"> // </tspan>WEB_DEV<tspan fill="#FF4655"> // </tspan>GAMER
    </text>

    <!-- blinking cursor -->
    <rect x="905" y="184" width="12" height="22" fill="#FF4655">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- bottom tag line -->
    <text x="600" y="250" text-anchor="middle" font-family="'Courier New', monospace"
      font-size="14" fill="#4A5568" letter-spacing="2">
      LOCKED IN • RANK: ALWAYS_LEARNING • MAP: TRUNOJOYO_MADURA
    </text>

    <!-- bottom thin accent bar -->
    <rect x="0" y="296" width="1200" height="4" fill="#FF4655">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
